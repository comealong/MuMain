[project]
name = "mu-art-pipeline"
version = "0.1.0"
description = "Python asset inventory and MCP tools for the MuMain game client."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26,<2",
    "Pillow>=10.4,<13",
]

[project.scripts]
mu-art = "mu_art_pipeline.cli:main"
mu-art-mcp = "mu_art_pipeline.mcp_server:main"
mu-blender-mcp = "mu_art_pipeline.blender_mcp:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [".agents/skills/mu-art-pipeline/scripts/mu_art_pipeline"]
